# Déploiement sur GitHub Pages à chaque push sur main.
# Actions épinglées par SHA de commit (le tag est en commentaire) : une étiquette déplacée ne change rien ici.
# Activer une seule fois : dépôt GitHub → Settings → Pages → Source : « GitHub Actions ».
#
# Dépôt « SolalDFG.github.io »   → site servi à https://solaldfg.github.io/       (BASE_PATH = /)
# Dépôt d'un autre nom (ex. portfolio) → https://solaldfg.github.io/portfolio/  (BASE_PATH = /portfolio)
# Domaine personnalisé : définis la variable de dépôt SITE_URL (Settings → Variables → Actions)
# et BASE_PATH="/" ; ajoute aussi le domaine dans Settings → Pages.
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (Node 24)
        with:
          node-version: 22
          cache: npm

      - name: Calcul de l'URL du site
        id: site
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo="${GITHUB_REPOSITORY#*/}"
          if [ -n "${{ vars.SITE_URL }}" ]; then
            echo "url=${{ vars.SITE_URL }}" >> "$GITHUB_OUTPUT"
            echo "base=${{ vars.BASE_PATH || '/' }}" >> "$GITHUB_OUTPUT"
          elif [ "$(echo "$repo" | tr '[:upper:]' '[:lower:]')" = "${owner}.github.io" ]; then
            echo "url=https://${owner}.github.io" >> "$GITHUB_OUTPUT"
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://${owner}.github.io" >> "$GITHUB_OUTPUT"
            echo "base=/${repo}" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ steps.site.outputs.url }}
          BASE_PATH: ${{ steps.site.outputs.base }}

      - name: Vérification confidentialité
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils   # pdftotext : texte des PDF vérifié aussi
          npm run check:privacy

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0 (upload-artifact v7, Node 24)
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1 (Node 24)
