fr:
  title: "Kasgrunt : infrastructure complète pour un client fictif"
  impact: "Projet annuel en équipe de 3 : chef de projet d'« ESGI Consulting », j'ai aussi monté le cluster Proxmox HA avec Ceph, les sauvegardes et la supervision."
  context: "Projet annuel de Bachelor à l'ESGI, en équipe de trois. Mise en situation : l'équipe joue « ESGI Consulting », le prestataire chargé de concevoir toute l'infrastructure du client fictif Kasgrunt."
  goal: "Livrer une infrastructure complète, haute disponibilité, sauvegardée et supervisée, pilotée avec les outils de gestion de projet d'un vrai prestataire."
  doneTitle: "Qui a fait quoi"
  done:
    - "**Chef de projet** (moi) : découpage WBS, RBS, PBS, matrice RACI, planning PERT et Gantt, coordination de l'équipe."
    - "**Virtualisation** (moi) : cluster **Proxmox VE de 3 nœuds** sur un serveur OVH, **haute disponibilité** et stockage distribué **Ceph**."
    - "**Sauvegarde** (moi) : **Proxmox Backup Server** et politique de sauvegarde."
    - "**Supervision** (moi) : **Zabbix** pour la collecte et les alertes, **Grafana** pour les tableaux de bord."
    - "**Messagerie d'équipe** (moi) : **Mattermost**."
    - "**Réseau et sécurité** (un coéquipier) : pare-feux, maquette EVE-NG, VLAN, VPN IPSec."
    - "**Systèmes et Active Directory** (une coéquipière)."
  doneNote: "Un projet de groupe : la liste présente l'ensemble et indique qui a porté chaque partie."
  # TODO_SOLAL : difficultés génériques, à remplacer par celles vécues par l'équipe si tu en as de meilleures.
  challenges:
    - problem: "Un périmètre très large (réseau, systèmes, virtualisation, supervision) à répartir entre trois personnes."
      solution: "En tant que chef de projet : découpage en WBS/PBS, responsabilités fixées dans une matrice RACI, planning PERT et Gantt suivi pendant l'année."
    - problem: "Concevoir et tester une infrastructure réseau complète sans matériel physique."
      solution: "Maquettage sous EVE-NG pour valider la topologie et les flux, et un serveur OVH pour héberger le cluster Proxmox."
  result: "Projet terminé et rendu."
  learnings:
    - "Une infrastructure se pense comme un tout : chaque brique dépend des autres."
    - "Être chef de projet tout en gardant une grosse partie technique oblige à planifier son propre temps aussi sérieusement que celui de l'équipe."
  diagramCaption: "Schéma de principe simplifié de l'infrastructure proposée (vue fonctionnelle)."

en:
  title: "Kasgrunt: full infrastructure for a fictional client"
  impact: "Annual project in a team of 3: project manager of “ESGI Consulting”, I also built the Proxmox HA cluster with Ceph, the backups and the monitoring."
  context: "Annual Bachelor project at ESGI, in a team of three. Scenario: the team plays “ESGI Consulting”, the provider hired to design the whole infrastructure of the fictional client Kasgrunt."
  goal: "Deliver a complete, highly available, backed-up and monitored infrastructure, run with the project management tools of a real provider."
  doneTitle: "Who did what"
  done:
    - "**Project manager** (me): WBS, RBS and PBS breakdown, RACI matrix, PERT and Gantt planning, team coordination."
    - "**Virtualisation** (me): **3-node Proxmox VE cluster** on an OVH server, **high availability** and **Ceph** distributed storage."
    - "**Backups** (me): **Proxmox Backup Server** and the backup policy."
    - "**Monitoring** (me): **Zabbix** for collection and alerts, **Grafana** for dashboards."
    - "**Team chat** (me): **Mattermost**."
    - "**Network and security** (a teammate): firewalls, EVE-NG lab, VLANs, IPSec VPN."
    - "**Systems and Active Directory** (a teammate)."
  doneNote: "A group project: the list covers the whole scope and says who owned each part."
  challenges:
    - problem: "A very broad scope (network, systems, virtualisation, monitoring) to split across three people."
      solution: "As project manager: WBS/PBS breakdown, responsibilities set in a RACI matrix, PERT and Gantt planning tracked through the year."
    - problem: "Designing and testing a full network infrastructure without physical hardware."
      solution: "Prototyping on EVE-NG to validate topology and flows, and an OVH server to host the Proxmox cluster."
  result: "Project completed and delivered."
  learnings:
    - "An infrastructure has to be designed as a whole: every block depends on the others."
    - "Managing the project while owning a large technical part means planning your own time as seriously as the team's."
  diagramCaption: "Simplified high-level diagram of the proposed infrastructure (functional view)."
