# /etc/nginx/sites-available/portfolio
# Site statique du portfolio. Écoute en HTTP sur le LAN uniquement :
# l'accès public passe par Cloudflare Tunnel (cloudflared → http://localhost:80),
# aucun port n'est ouvert sur la box et l'IP publique n'est jamais exposée.

# CSP envoyée uniquement sur les pages HTML (le visualiseur PDF du navigateur
# n'aime pas une CSP stricte sur les certificats). Aucun script/style inline sur le site.
map $sent_http_content_type $portfolio_csp {
    default "";
    ~^text/html "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/portfolio;
    index index.html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;   # redirections relatives (correct derrière Cloudflare Tunnel)

    # Cloudflare Tunnel se connecte depuis localhost : on garde la vraie IP visiteur dans les logs
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    include snippets/security-headers.conf;

    # Pages : URLs propres (/projets/homelab-proxmox/ → index.html)
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache" always;
        include snippets/security-headers.conf;
    }

    # Assets versionnés par Astro (nom contenant un hash) : cache 1 an
    location /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/security-headers.conf;
        access_log off;
    }

    # Images, icônes, certificats, CV : cache 7 jours (pas de hash dans le nom)
    location ~* \.(?:png|webp|svg|ico|pdf|webmanifest|js)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
        include snippets/security-headers.conf;
        access_log off;
    }

    # Fichiers cachés (.git, .env…) : jamais servis
    location ~ /\. {
        deny all;
        return 404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        include snippets/security-headers.conf;
    }

    # Pas de méthodes inutiles sur un site statique
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }
}
