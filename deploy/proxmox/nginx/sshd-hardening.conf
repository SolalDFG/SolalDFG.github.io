# /etc/ssh/sshd_config.d/90-hardening.conf : SSH du CT portfolio
# Connexion par clé uniquement, root interdit, seul l'utilisateur « deploy » (rsync) est accepté.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AllowUsers deploy
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
MaxAuthTries 3
LoginGraceTime 20
